:root {
  --bg-dark: #0a0d0c;
  --bg-card: #121816;
  --text-main: #f0fdf4;
  --text-muted: #86efac;
  --text-dim: #9ca3af;

  --ds-green-glow: rgba(16, 185, 129, 0.35);
  --ds-green-bright: #34d399;
  --ds-dark-pattern: #0d1f18;
  --ds-black: #050807;

}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 0;
  background-color: var(--bg-dark);
  background-image: 
    linear-gradient(45deg, var(--ds-dark-pattern) 25%, transparent 25%), 
    linear-gradient(-45deg, var(--ds-dark-pattern) 25%, transparent 25%), 
    linear-gradient(45deg, transparent 75%, var(--ds-dark-pattern) 75%), 
    linear-gradient(-45deg, transparent 75%, var(--ds-dark-pattern) 75%);
  background-size: 40px 40px;
  background-position: 0 0, 0 20px, 20px -20px, -20px 0px;
  color: var(--text-main);
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  line-height: 1.6;
}

.header {
  background: rgba(5, 8, 7, 0.92);
  backdrop-filter: blur(12px);
  border-bottom: 2px solid var(--ds-green);
  padding: 16px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 4px 25px rgba(16, 185, 129, 0.25);
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 1.4rem;
  font-weight: 800;
  color: var(--text-main);
  letter-spacing: 0.5px;
  text-shadow: 0 0 10px var(--ds-green-glow);
}

.logo svg { width: 36px; height: 36px; filter: drop-shadow(0 0 8px var(--ds-green)); }
.header-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

.social-btn, button, .nav-links a { position: relative; overflow: hidden; }

.social-btn::after, button::after, .nav-links a::after {
  content: '';
  position: absolute;
  top: -50%;
  left: -60%;
  width: 40px;
  height: 200%;
  background: linear-gradient(to right, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.3) 50%, rgba(255, 255, 255, 0) 100%);
  transform: rotate(30deg);
  transition: all 0.6s ease;
  pointer-events: none;
}

.social-btn:hover::after, button:hover::after, .nav-links a:hover::after { left: 130%; }

.social-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 16px;
  border-radius: 999px;
  text-decoration: none;
  font-weight: 700;
  font-size: 0.88rem;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  border: 1px solid rgba(255, 255, 255, 0.1);
}

.youtube-btn { background: #dc2626; color: white; }
.youtube-btn:hover { background: #ef4444; box-shadow: 0 0 18px rgba(220, 38, 38, 0.7); transform: translateY(-2px); }

.github-btn { background: #111827; color: white; border: 1px solid rgba(255, 255, 255, 0.2); }

.social-btn svg { width: 18px; height: 18px; }
.container { max-width: 950px; margin: 0 auto; padding: 32px 20px; }

h1 {

}

.subtitle {

button, input, select {

  color: var(--text-main);
  font-weight: 600;
  font-size: 0.92rem;
  outline: none;
  transition: all 0.25s ease;

select option { background: var(--bg-card); color: var(--text-main); }
button:hover, select:hover, input:hover { border-color: var(--ds-green); box-shadow: 0 0 12px var(--ds-green-glow); }

#setAlarm { background: var(--ds-green); color: var(--ds-black); border: none; font-weight: 800; }

#clocks { display: flex; flex-direction: column; gap: 16px; }

.clock {
  padding: 20px 24px;
  border-radius: 20px;
  background: var(--bg-card);
  border: 1px solid var(--ds-border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  box-shadow: var(--card-shadow);
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  overflow: hidden;
}

.clock::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  width: 4px;
  background: var(--ds-green);
  box-shadow: 0 0 12px var(--ds-green);
}

.clock::after {
  content: '';
  position: absolute;
  top: -50%;
  left: -70%;
  width: 60px;
  height: 200%;
  background: linear-gradient(to right, rgba(255, 255, 255, 0) 0%, rgba(52, 211, 153, 0.15) 50%, rgba(255, 255, 255, 0) 100%);
  transform: rotate(30deg);
  transition: all 0.7s ease;
  pointer-events: none;
}

.clock:hover::after { left: 130%; }
.clock:hover { transform: translateY(-3px); border-color: var(--ds-green-bright); box-shadow: 0 12px 35px rgba(16, 185, 129, 0.3); }

.blog-card:hover { transform: translateY(-3px); border-color: rgba(16, 185, 129, 0.5); box-shadow: 0 10px 30px rgba(16, 185, 129, 0.2); }

.seo-content h3 { margin-top: 20px; color: var(--text-main); }
.blog-meta { font-size: 0.85rem; color: var(--ds-green); margin-bottom: 14px; font-weight: 600; }
.seo-content p, .blog-card p, .seo-content li { color: #d1d5db; }

.nav-links { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 24px 0 36px; }
.nav-links a {
  background: var(--bg-card);
  padding: 10px 20px;

.nav-links a:hover { background: var(--ds-green); color: var(--ds-black); border-color: var(--ds-green); box-shadow: 0 0 18px var(--ds-green-glow); }

.city-list { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }

  font-weight: 600;
  border: 1px solid var(--ds-border);
  transition: all 0.3s ease;

.city-list span:hover {
  background: rgba(16, 185, 129, 0.2);
  color: #ffffff;

  box-shadow: 0 0 12px var(--ds-green-glow);

.footer {

  text-align: center;
  color: var(--text-dim);
  font-size: 0.92rem;
  border-top: 1px solid var(--ds-border);
  background: rgba(5, 8, 7, 0.8);

.footer a { color: var(--ds-green-bright); font-weight: 700; text-decoration: none; }

@media (max-width: 600px) {
  .header { flex-direction: column; text-align: center; }
  .header-right { justify-content: center; }
  h1 { font-size: 1.7rem; }
  .controls { border-radius: 20px; }
}
