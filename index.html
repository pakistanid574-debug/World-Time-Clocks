<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Primary SEO -->
<title>World Clock - Live World Time Zones | Current Time in 30+ Cities</title>
<meta name="description" content="Free live World Clock showing accurate current time in New York, London, Dubai, Riyadh, Karachi, Tokyo, Sydney and 30+ cities. Check time zones, set alarms and convert world times instantly.">
<meta name="keywords" content="world clock, world time, live world clock, time zone converter, current time in different countries, international clock, global time zones, multi city clock, world time zones, time difference, current time worldwide">

<!-- Open Graph (for social sharing) -->
<meta property="og:title" content="World Clock - Live Time Zones Worldwide">
<meta property="og:description" content="Check live time in 30+ cities around the world. Free, fast and accurate world clock with alarms.">
<meta property="og:type" content="website">
<meta property="og:locale" content="en_US">

<!-- Extra helpful meta -->
<meta name="robots" content="index, follow">
<meta name="author" content="Hassan Alvi">
<meta name="theme-color" content="#168760">

<style>
:root{
--bg:#168760;
--text:#000000;
--muted:#4b5563;
--card:#ffffffcc;
--border:#0000001a;
--accent:#16a34a;
}

body{
margin:0;
padding:10px;
background:var(--bg);
color:var(--text);
font-family:system-ui, -apple-system, sans-serif;
text-align:center;
}

.controls{
display:flex;
flex-wrap:wrap;
gap:10px;
justify-content:center;
margin-bottom:20px;
}

button,input,select{
padding:12px 16px;
border-radius:999px;
border:1px solid var(--border);
background:var(--card);
color:var(--text);
font-weight:600;
font-size:1rem;
}

#clocks{
display:flex;
flex-direction:column;
gap:15px;
margin-top:10px;
}

.clock{
padding:16px;
border-radius:16px;
background:var(--card);
border:1px solid var(--border);
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
}

.clock h3{
flex-basis:100%;
margin:0 0 5px 0;
}

.time{
font-size:1.4rem;
font-weight:700;
color:var(--accent);
}

.date{
font-size:0.85rem;
color:var(--muted);
}

.copyBtn{
padding:8px 12px;
font-size:0.9rem;
cursor:pointer;
}

.statusBar{
margin-top:10px;
font-size:0.9rem;
color:var(--accent);
font-weight:600;
}

.settingsPanel{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
padding:20px;
border-radius:16px;
border:1px solid #ccc;
display:none;
z-index:100;
width:230px;
}

.toggle{
display:flex;
align-items:center;
justify-content:space-between;
margin:15px 0;
font-weight:600;
}

#splash{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#16a34a;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
font-size:2rem;
font-weight:700;
z-index:9999;
}

#mainApp{
display:none;
}
</style>
</head>

<body>

<div id="splash">
  <h1>App Developer Hassan Alvi</h1>
</div>

<div id="mainApp">
  <h1>🌍 World Clock - Live World Time</h1>

  <div class="controls">
    <select id="alarmCity"></select>
    <input type="time" id="alarmTime">
    <button id="setAlarm">🔔 Add Alarm</button>
    <button id="openSettings">⚙️ Settings</button>
  </div>

  <div id="chargeStatus" class="statusBar"></div>
  <div id="clocks"></div>

  <div id="settingsPanel" class="settingsPanel">
    <h3>Settings</h3>
    <div class="toggle">
      Optimize
      <input type="checkbox" id="optimizeToggle">
    </div>
    <div class="toggle">
      AI Charging
      <input type="checkbox" id="aiChargeToggle">
    </div>
    <button id="closeSettings">Close</button>
  </div>
</div>

<script>
const zones=[
{c:"New York 🇺🇸",z:"America/New_York"},
{c:"London 🇬🇧",z:"Europe/London"},
{c:"Riyadh 🇸🇦",z:"Asia/Riyadh"},
{c:"Dubai 🇦🇪",z:"Asia/Dubai"},
{c:"Karachi 🇵🇰",z:"Asia/Karachi"},
{c:"Manama 🇧🇭",z:"Asia/Bahrain"},
{c:"Tehran 🇮🇷",z:"Asia/Tehran"},
{c:"Zurich 🇨🇭",z:"Europe/Zurich"},
{c:"Seoul 🇰🇷",z:"Asia/Seoul"},
{c:"Jakarta 🇮🇩",z:"Asia/Jakarta"},
{c:"Tokyo 🇯🇵",z:"Asia/Tokyo"},
{c:"Bangkok 🇹🇭",z:"Asia/Bangkok"},
{c:"Shanghai 🇨🇳",z:"Asia/Shanghai"},
{c:"Kenya 🇰🇪",z:"Africa/Nairobi"},
{c:"Mumbai 🇮🇳",z:"Asia/Kolkata"},
{c:"Bishkek 🇰🇬",z:"Asia/Bishkek"},
{c:"Bogota 🇨🇴",z:"America/Bogota"},
{c:"Los Angeles 🇺🇸",z:"America/Los_Angeles"},
{c:"Dhaka 🇧🇩",z:"Asia/Dhaka"},
{c:"Manila 🇵🇭",z:"Asia/Manila"},
{c:"Baku 🇦🇿",z:"Asia/Baku"},
{c:"Doha 🇶🇦",z:"Asia/Qatar"},
{c:"Kabul 🇦🇫",z:"Asia/Kabul"},
{c:"Algiers 🇩🇿",z:"Africa/Algiers"},
{c:"Buenos Aires 🇦🇷",z:"America/Buenos_Aires"},
{c:"Dublin 🇮🇪",z:"Europe/Dublin"},
{c:"Sydney 🇦🇺",z:"Australia/Sydney"},
{c:"British Indian Ocean Territory 🇮🇴",z:"Indian/Chagos"},
{c:"Istanbul 🇹🇷",z:"Asia/Istanbul"},
{c:"Copenhagen 🇩🇰",z:"Europe/Copenhagen"}
];

const wrap = document.getElementById("clocks");
const alarmCity = document.getElementById("alarmCity");
const alarmTime = document.getElementById("alarmTime");
const settingsPanel = document.getElementById("settingsPanel");
const openSettings = document.getElementById("openSettings");
const closeSettings = document.getElementById("closeSettings");
const optimizeToggle = document.getElementById("optimizeToggle");
const aiToggle = document.getElementById("aiChargeToggle");
const chargeStatus = document.getElementById("chargeStatus");

let optimize = localStorage.getItem("optimize") === "true";
optimizeToggle.checked = optimize;

let aiCharge = localStorage.getItem("aiCharge") === "true";
aiToggle.checked = aiCharge;

let alarm = JSON.parse(localStorage.getItem("alarm") || "null");
let lastTimes = {};

zones.forEach(z => {
  alarmCity.innerHTML += `<option value="\( {z.z}"> \){z.c}</option>`;

  const d = document.createElement("div");
  d.className = "clock";
  d.innerHTML = `
    <h3>${z.c}</h3>
    <div class="date"></div>
    <div class="time"></div>
    <button class="copyBtn">📋 Copy</button>
  `;
  d.z = z.z;
  wrap.appendChild(d);

  d.querySelector(".copyBtn").onclick = () => {
    const now = new Date();
    const t = now.toLocaleTimeString("en-US", {
      timeZone: z.z,
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit"
    });
    navigator.clipboard.writeText(t);
  };
});

document.getElementById("setAlarm").onclick = () => {
  if (!alarmTime.value) {
    alert("Select time");
    return;
  }
  alarm = {
    zone: alarmCity.value,
    time: alarmTime.value,
    fired: false
  };
  localStorage.setItem("alarm", JSON.stringify(alarm));
  alert("Alarm set ✔");
};

openSettings.onclick = () => settingsPanel.style.display = "block";
closeSettings.onclick = () => settingsPanel.style.display = "none";

optimizeToggle.onchange = () => {
  optimize = optimizeToggle.checked;
  localStorage.setItem("optimize", optimize);
};

aiToggle.onchange = () => {
  aiCharge = aiToggle.checked;
  localStorage.setItem("aiCharge", aiCharge);
};

function updateClocks() {
  const now = new Date();

  document.querySelectorAll(".clock").forEach(c => {
    const t = now.toLocaleTimeString("en-US", { timeZone: c.z });

    if (lastTimes[c.z] !== t) {
      c.querySelector(".time").textContent = t;
      c.querySelector(".date").textContent = now.toLocaleDateString("en-US", {
        timeZone: c.z,
        weekday: "long"
      });
      lastTimes[c.z] = t;
    }
  });

  if (alarm && !alarm.fired) {
    const check = now.toLocaleTimeString("en-GB", {
      timeZone: alarm.zone,
      hour: "2-digit",
      minute: "2-digit"
    });

    if (check === alarm.time) {
      alarm.fired = true;
      localStorage.setItem("alarm", JSON.stringify(alarm));
      alert("🔔 Alarm Time!");
    }
  }

  if (optimize) {
    setTimeout(updateClocks, 1000);
  } else {
    requestAnimationFrame(updateClocks);
  }
}

updateClocks();

/* AI Charging */
if ('getBattery' in navigator) {
  navigator.getBattery().then(function(battery) {
    function updateBattery() {
      if (!aiCharge) {
        chargeStatus.textContent = "";
        return;
      }
      if (battery.charging) {
        chargeStatus.textContent = "⚡ AI Charging Active - Optimized Charging";
      } else {
        chargeStatus.textContent = "🔋 Running on Battery";
      }
    }
    battery.addEventListener("chargingchange", updateBattery);
    updateBattery();
  });
}

/* Splash screen hide */
setTimeout(() => {
  document.getElementById("splash").style.display = "none";
  document.getElementById("mainApp").style.display = "block";
}, 1500);
</script>

</body>
</html>
