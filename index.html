<script>
function updateNorwayTime() {
  const now = new Date();
  const timeStr = now.toLocaleTimeString("no-NO", {
    timeZone: "Europe/Oslo",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit"
  });
  document.getElementById("norwayTime").textContent = timeStr;
  setTimeout(updateNorwayTime, 1000);
}
updateNorwayTime();
</script>
